[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "agentlens"
version = "0.1.0"
description = "AgentLens Observability SDK"
authors = [
    {name = "AgentLens"}
]
dependencies = [
    "requests>=2.25.1"
]

[tool.setuptools.packages.find]
where = ["."]
include = ["agentlens_sdk*"]
